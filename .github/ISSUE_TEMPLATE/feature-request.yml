name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change? Mention files or settings if you know them.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you work on it?
      options:
        - "Yes, I would open a PR"
        - "Maybe, with guidance"
        - "No, just suggesting"
